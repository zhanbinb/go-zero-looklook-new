# air.usercenter.toml
# 配置 air 监控 usercenter-rpc 服务
# 用法: air -c air.usercenter.toml
#
# 注意: 不用 .air.toml (那是 air 默认文件名, 会自动加载)
#       用 air.<service>.toml 避免和别的服务冲突

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # build 前执行的命令 (go-zero 项目一般 go mod tidy 一次就够)
  pre = []

  # build 命令
  cmd = "go build -o ./tmp/usercenter-rpc ./app/usercenter/cmd/rpc && go build -o ./tmp/usercenter-api ./app/usercenter/cmd/api"

  # 启动的二进制 + 参数
  # air 一次只能跑一个进程, 用 shell 脚本同时启 rpc + api
  # 脚本: scripts/start-usercenter.sh (含 trap, 信号来了 kill 两个进程)
  full_bin = "./scripts/start-usercenter.sh"

  # 延迟 (ms) - 文件变化后等多久再 build, 防止编辑器连续保存
  delay = 1000

  # build 出错时停止 (不杀旧进程, 旧版本继续跑)
  stop_on_error = true

  # 包含的文件后缀 (改 .go 或 .yaml 都触发 build)
  include_ext = ["go", "yaml", "yml"]

  # 排除的目录 (data 是 mysql/es 数据, deploy 是运维脚本)
  exclude_dir = [
    "data",
    "tmp",
    "vendor",
    "deploy",
    "node_modules",
    ".git",
    "notes",
  ]

  # build 错误的 log 文件
  log = "build-errors.log"

  # 增量 build (新版 air 用 args_bin 字段, 我们不用增量保持简单)
  args_bin = []

[log]
  # 显示时间戳
  time = true

  # 彩色输出
  color = true

  # 只显示 main 进程的 log (不显示子进程)
  # 关闭: 看到 usercenter-rpc 自己的 log
  main_only = false

[misc]
  # 退出时清理 tmp 目录
  clean_on_exit = true

[screen]
  # 清屏频率 (build 成功时清屏, 失败时不清)
  clear_on_rebuild = true

  # 滚动条 (true: 显示 air 自己的状态条, false: 只看 log)
  scrollback = 1000
