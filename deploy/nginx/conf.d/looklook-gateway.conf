server {
    listen 8081;
    access_log /var/log/nginx/looklook.com_access.log;
    error_log  /var/log/nginx/looklook.com_error.log;

    # ============================================
    # A. 内部子请求端点 (nginx 内部用, 外部访问不到)
    # ============================================
    location = /auth_check {
        internal;
        proxy_pass http://host.docker.internal:1004/usercenter/v1/auth_check;
        proxy_pass_request_body off;
        proxy_set_header Host $http_host;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # ============================================
    # B. 公开端点 (不需要 token, 优先级最高, = 精确匹配)
    # ============================================
    # B.1 usercenter 公开: login / register (拿 token 之前)
    location = /usercenter/v1/user/login {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://host.docker.internal:1004;
    }
    location = /usercenter/v1/user/register {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://host.docker.internal:1004;
    }
    # B.2 payment 公开: WeChat 回调 (微信服务器 POST XML, 没 token)
    location = /payment/v1/thirdPayment/thirdPaymentWxPayCallback {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://host.docker.internal:1002;
    }

    # ============================================
    # C. 公开正则 (整段不需要 token)
    # ============================================
    # travel 完全公开 (homestay list / detail / business list 等 8 个 endpoint)
    location ~ /travel/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://host.docker.internal:1003;
    }

    # ============================================
    # D. 受保护端点 (需要 token, auth_request 调 /auth_check)
    # ============================================
    # D.1 order 全保护 (3 个 endpoint 都要 token)
    location ~ /order/ {
        auth_request /auth_check;
        auth_request_set $auth_user_id   $upstream_http_x_user_id;
        auth_request_set $auth_tenant_id $upstream_http_x_tenant_id;

        proxy_set_header X-User-Id   $auth_user_id;
        proxy_set_header X-Tenant-Id $auth_tenant_id;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_pass http://host.docker.internal:1001;
    }

    # D.2 payment 保护 (但 callback 已在 B.2 处理)
    location ~ /payment/ {
        auth_request /auth_check;
        auth_request_set $auth_user_id   $upstream_http_x_user_id;
        auth_request_set $auth_tenant_id $upstream_http_x_tenant_id;

        proxy_set_header X-User-Id   $auth_user_id;
        proxy_set_header X-Tenant-Id $auth_tenant_id;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_pass http://host.docker.internal:1002;
    }

    # D.3 usercenter 保护 (但 login/register 已在 B.1 处理)
    # /usercenter/v1/auth_check 这条路径也会落到这里, nginx sub-request 走 location = /auth_check
    # (但如果外部直接访问 /usercenter/v1/auth_check, 走这里, auth_request 没 token → 401)
    location ~ /usercenter/ {
        auth_request /auth_check;
        auth_request_set $auth_user_id   $upstream_http_x_user_id;
        auth_request_set $auth_tenant_id $upstream_http_x_tenant_id;

        proxy_set_header X-User-Id   $auth_user_id;
        proxy_set_header X-Tenant-Id $auth_tenant_id;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_pass http://host.docker.internal:1004;
    }
}
