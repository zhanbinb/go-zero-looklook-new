# APISIX Dashboard 3.0.0 配置

conf:
  listen:
    host: 0.0.0.0
    port: 8080

  etcd:
    endpoints:
      - 127.0.0.1:2379

  log:
    error_log:
      level: warn
    access_log:
      level: info

  authentication:
    expire_time: 3600
    secret: "i-am-a-secret"
    users:                  # ★ map[string]User 格式, 不是 list!
      admin:                # key 就是用户名
        password: admin     # 只剩 password 字段
