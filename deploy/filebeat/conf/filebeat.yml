filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /var/log/looklook/*.log
    fields:
      log_type: looklook_business
    fields_under_root: true
  - type: log
    enabled: true
    paths:
      - /var/lib/docker/containers/*/*-json.log
    fields:
      log_type: docker_container
    fields_under_root: true

filebeat.config:
  modules:
    path: ${path.config}/modules.d/*.yml
    reload.enabled: false

processors:
  - add_cloud_metadata: ~
  - add_docker_metadata: ~

output.kafka:
  enabled: true
  hosts: ["kafka:9092"]
  topic: "looklook-log"
  partition.hash:
    reachable_only: true
  compression: gzip
  max_message_bytes: 1000000
  required_acks: 1
