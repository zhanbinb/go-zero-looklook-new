# .air.toml
# 统一管理全部服务 (对标 modd.conf)
# 用法: air -c .air.toml
#  cmd        -> scripts/dev-build.sh   (构建 11 个 binary 到 ./tmp/)
#  entrypoint -> scripts/dev-up.sh      (启动 11 个服务, 退出自动清理)
# 注: air v1.67.4 起 full_bin 被废弃, 官方新字段是 entrypoint (行为一致)
#     旧的 air.usercenter.toml + scripts/start-usercenter.sh 验证通过后删除

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # 构建全部服务
  cmd = "./scripts/dev-build.sh"

  # 启动全部服务 (air 一次只能跑一个进程, 所以用脚本编排)
  entrypoint = ["./scripts/dev-up.sh"]

  # 文件变化后等多久再 build
  delay = 1000

  # build 失败就停, 不重启旧进程
  stop_on_error = true

  # rebuild 时先发 SIGINT 给整个进程组, 让脚本 trap 优雅清理子进程
  send_interrupt = true

  # 改 .go / .yaml 都触发
  include_ext = ["go", "yaml", "yml"]

  exclude_dir = ["data", "tmp", "vendor", "deploy", "node_modules", ".git", "notes"]

  log = "build-errors.log"

[log]
  time = true
  color = true
  main_only = false

[misc]
  # 不清空 tmp (里面是 11 个 binary, 重启复用, 省编译时间)
  clean_on_exit = false

[screen]
  clear_on_rebuild = true
  scrollback = 1000
